<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Scheduler table tests</title>
<link rel="stylesheet" href="../.pio/libdeps/nodemcu-32s_debug/ESPUI/data/css/normalize.min.css">
<link rel="stylesheet" href="../.pio/libdeps/nodemcu-32s_debug/ESPUI/data/css/style.min.css">
<link rel="stylesheet" href="../.pio/libdeps/nodemcu-32s_debug/ESPUI/data/css/pickr.min.css">
<!-- Deliberately stronger than normalize's [hidden]: exercise host-page CSS overrides too. -->
<style>[data-scheduler] input { display:block; } [data-scheduler] button { display:inline-block; }</style>
<body style="background:#34495e;color:white;font-family:sans-serif">
<h1>Scheduler table tests</h1>
<div data-scheduler data-slot-count="8">
	<div style="width:100%;overflow-x:auto">
	<table style="width:100%;min-width:1050px;color:white;background:transparent">
		<thead><tr><th>Slot</th><th>Active</th><th>On</th><th>From</th><th>To</th><th>Time</th><th>Color</th><th>Message</th><th>Range</th><th>Value</th></tr></thead>
		<tbody></tbody>
	</table>
	</div>
	<p>Logging only; no persistence. Reload restores initial firmware rows.</p>
	<button type="button" data-action="add-scheduler-row">Add row</button>
	<button type="button" data-action="remove-selected-scheduler-rows" disabled>Remove selected rows</button>
	<button type="button" data-action="reload-scheduler">Reload</button>
	<button type="button" data-action="save-scheduler">Save</button>
	<span data-scheduler-status role="status"></span>
</div>
<pre id="results"></pre>
<script src="../.pio/libdeps/nodemcu-32s_debug/ESPUI/data/js/pickr.min.js"></script>
<script>
// Record real instances, not mocks, to verify initialization and disposal.
const actualPickers = [];
const actualPickerByAnchor = new WeakMap();
const pickerReady = [];
let destroyedPickers = 0;
let storageHiddenUntilInit = true;
// Capture the real scheduled retry so the late-publication test can advance it deterministically.
const actualSetTimeout = window.setTimeout.bind(window);
let pickerRetryTask;
let pickerRetryId;
window.setTimeout = (callback, delay, ...args) => {
	const id = actualSetTimeout(callback, delay, ...args);
	if (delay === 250) { pickerRetryTask = callback; pickerRetryId = id; }
	return id;
};
if (window.Pickr) {
	const create = window.Pickr.create;
	window.Pickr.create = options => {
		const picker = create(options);
		if (!options.el.matches('[data-scheduler] [data-color-anchor]')) return picker;
		let finished;
		pickerReady.push(new Promise(resolve => { finished = resolve; }));
		const destroy = picker.destroyAndRemove.bind(picker);
		picker.destroyAndRemove = () => { destroyedPickers++; finished(); return destroy(); };
		actualPickers.push(picker);
		actualPickerByAnchor.set(options.el, picker);
		picker.on('init', () => {
			const input = options.el.closest('tr').querySelector('[data-field="color"]');
			storageHiddenUntilInit &&= input.type === 'text' && getComputedStyle(input).display === 'none' &&
				options.el.disabled;
		});
		picker.on('init', finished);
		return picker;
	};
}
</script>
<script src="../tools/ota_uploader.js"></script>
<script>
// Synthetic controls exercise the production JavaScript. Fetch is mocked: no device is contacted.
(async () => {
	const root = document.querySelector('[data-scheduler]');
	const output = document.getElementById('results');
	let passed = 0;
	function check(condition, name) {
		if (!condition) throw new Error(name);
		passed++;
		output.textContent += 'PASS: ' + name + '\n';
	}
	function rejects(action, name) {
		let rejected = false;
		try { action(); } catch { rejected = true; }
		check(rejected, name);
	}
	// Yield an event-loop turn so mutation observers and Pickr's deferred init can finish.
	const settle = () => new Promise(resolve => setTimeout(resolve, 0));
	function selectSlot(slot, checked = true) {
		const input = root.querySelector('tr[data-slot="' + slot + '"] [data-row-selected]');
		input.checked = checked;
		input.dispatchEvent(new Event('change', { bubbles: true }));
	}
	const allUnselected = () => !root.querySelector('tbody [data-row-selected]:checked');
	// Assert computed geometry under the selected ESPUI styles, not just CSS text.
	function checkLayout(tableRoot, state) {
		const visible = Array.from(tableRoot.querySelectorAll('tbody tr[data-slot]'));
		const near = (a, b) => Math.abs(a - b) < 1;
		check(Array.from(tableRoot.querySelectorAll('thead th')).every(cell => {
			const css = getComputedStyle(cell);
			return css.textAlign === 'center' && css.verticalAlign === 'middle';
		}), state + ': headers centered horizontally and vertically');
		check(visible.every(row => Array.from(row.cells).every(cell => {
			const group = cell.querySelector('[data-scheduler-cell]');
			const bounds = cell.getBoundingClientRect();
			const children = Array.from(group.children).filter(child => child.getClientRects().length);
			const rects = children.map(child => child.getBoundingClientRect());
			const css = getComputedStyle(cell);
			// Borders contribute half a pixel to the interior's vertical midpoint.
			const middleY = (bounds.top + bounds.bottom - parseFloat(css.borderBottomWidth)) / 2;
			return css.textAlign === 'center' && css.verticalAlign === 'middle' &&
				near((Math.min(...rects.map(rect => rect.left)) + Math.max(...rects.map(rect => rect.right))) / 2,
					(bounds.left + bounds.right) / 2) &&
				rects.every(rect => near((rect.top + rect.bottom) / 2, middleY));
		})), state + ': every item/group centered in its cell');
		const borderFailures = visible.flatMap((row, index) => Array.from(row.cells).flatMap((cell, column) => {
			const css = getComputedStyle(cell);
			// Fractional browser zoom can rasterize a 1 CSS-pixel border as 0.8px.
			const valid = index === visible.length - 1 ? parseFloat(css.borderBottomWidth) === 0 :
				Math.abs(parseFloat(css.borderBottomWidth) - 1) <= 0.25 &&
				css.borderBottomStyle === 'solid' && css.borderBottomColor === 'rgb(128, 128, 128)';
			return valid ? [] : ['slot ' + row.dataset.slot + ', column ' + column + ': ' + css.borderBottom];
		}));
		check(borderFailures.length === 0, state + ': gray separators only between displayed rows' +
			(borderFailures.length ? ' (' + borderFailures[0] + ')' : ''));
		check(visible.every(row => ['[data-field="from"]', '[data-field="to"]', '[data-field="time"]',
			'[data-color-anchor]', '[data-field="message"]', '[data-field="range"]'].every(selector => {
			const input = row.querySelector(selector);
			const css = getComputedStyle(input);
			return near(input.getBoundingClientRect().height, 26) && css.boxSizing === 'border-box' &&
				css.marginTop === '0px' && css.marginBottom === '0px' && css.marginLeft === '0px' && css.marginRight === '0px' &&
				css.paddingTop === '2px' && css.paddingBottom === '2px';
		})), state + ': color/day/time/text fields share 26px sizing and spacing');
	}
	try {
		// Reproduce the old hidden-only failure under a host display override (not a Pickr API issue).
		const probe = document.createElement('input');
		probe.type = 'color'; probe.hidden = true; root.append(probe);
		check(getComputedStyle(probe).display === 'block', 'host display override reproduces hidden-only native input exposure');
		probe.remove();
		for (let slot = 0; slot < 8; slot++) {
			const tr = document.createElement('tr');
			tr.dataset.slot = slot;
			tr.innerHTML = '<td><input type="checkbox" data-row-selected aria-label="Select slot ' + slot + '" style="display:inline-block;width:auto;height:auto;margin:0;padding:0;box-shadow:none;background:transparent"><span data-slot-label>' + slot + '</span></td>' + ['active', 'on', 'from', 'to', 'time'].map(field => {
				if (field === 'from' || field === 'to') {
					return '<td><select data-field="' + field + '" style="width:auto;color:#111;background:#fff;box-shadow:none">' + ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((day, value) => '<option value="' + value + '">' + day + '</option>').join('') + '</select></td>';
				}
				return '<td><input data-field="' + field + '" type="' + (field === 'time' ? 'time' : 'checkbox') + '" step="60" value="00:00" style="width:auto;' + (field === 'time' ? 'color:#111;background:#fff;' : 'height:auto;padding:0;background:transparent;') + 'box-shadow:none"></td>';
			}).join('') + '<td><input type="text" data-color-anchor readonly role="button" aria-haspopup="dialog" aria-label="Choose color" disabled><span data-color-status role="status">Color picker loading…</span><input type="text" hidden style="display:none!important" data-field="color" value="#ffffff"></td>' +
				'<td><input type="text" data-field="message" maxlength="64" style="width:180px;color:#111;background:#fff" value="' + (slot === 0 ? 'Initial &amp; firmware' : '') + '"></td>' +
				'<td><select data-field="range" style="width:90px;color:#111;background:#fff"><option value="0">0..100</option><option value="1">20..50</option></select></td>' +
				'<td><input type="range" data-field="value" min="0" max="100" value="0" style="width:120px"><output data-value-output>0</output></td>';
			// Mirror the production cell groups, including the detached template.
			for (const cell of tr.cells) {
				const group = document.createElement('div');
				group.dataset.schedulerCell = '';
				group.append(...cell.childNodes);
				cell.append(group);
			}
			if (slot === 0) {
				// Simulate actual firmware defaults (attributes, not browser-only properties).
				tr.querySelector('[data-field="active"]').setAttribute('checked', '');
				tr.querySelector('[data-field="on"]').setAttribute('checked', '');
				tr.querySelector('[data-field="time"]').setAttribute('value', '19:42');
				tr.querySelector('[data-field="color"]').setAttribute('value', '#2244FF');
				tr.querySelector('[data-field="from"] option[value="3"]').setAttribute('selected', '');
				tr.querySelector('[data-field="to"] option[value="5"]').setAttribute('selected', '');
				tr.querySelector('[data-field="range"] option[value="1"]').setAttribute('selected', '');
				const slider = tr.querySelector('[data-field="value"]');
				slider.setAttribute('min', '20'); slider.setAttribute('max', '50'); slider.setAttribute('value', '35');
			}
			root.querySelector('tbody').append(tr);
		}
		const template = document.createElement('template');
		template.dataset.schedulerRowTemplate = '';
		template.content.append(root.querySelector('tr[data-slot="7"]').cloneNode(true));
		root.querySelector('tbody').append(template);
		const api = window.WordClockScheduler;
		// Edit before observer delivery/API access: baseline must still use firmware defaults.
		root.querySelector('[data-field="message"]').value = 'Early browser edit';
		const initial = api.getRows();
		initial[0].message = 'Initial & firmware';
		const rows = Array.from({ length: 8 }, (_, slot) => ({ slot, active: slot === 0, on: slot === 0, from: 5, to: 6, hour: slot === 0 ? 23 : 0, minute: slot === 0 ? 59 : 0,
			color: '#12ABEF', message: slot === 0 ? '<b>Grüße 🌈 & "hello"</b>' : '', range: slot % 2, value: slot % 2 ? 35 : 80 }));
		api.setRows(rows);
		check(JSON.stringify(api.getRows()) === JSON.stringify(rows), 'all slots round-trip');
		const removeSelected = root.querySelector('[data-action="remove-selected-scheduler-rows"]');
		check(removeSelected.textContent === 'Remove selected rows' && removeSelected.previousElementSibling.dataset.action === 'add-scheduler-row' && !removeSelected.closest('table'), 'explicit global Remove selected rows beside Add below table');
		check(root.querySelectorAll('thead th').length === 10 && Array.from(root.querySelectorAll('tbody tr[data-slot]')).every(row => row.cells.length === 10) && !root.querySelector('[data-action="remove-scheduler-row"]') && template.content.firstElementChild.cells.length === 10, 'no Action header or per-row action cells, including template');
		check(allUnselected() && removeSelected.disabled, 'populated table starts unselected with Remove disabled');
		check(Array.from(root.querySelectorAll('tbody tr[data-slot]')).every(row => {
			const selection = row.querySelector('[data-row-selected]');
			return selection.type === 'checkbox' && selection.closest('td') === row.cells[0] &&
				selection.getAttribute('aria-label') === 'Select slot ' + row.dataset.slot &&
				selection !== row.querySelector('[data-field="active"]') && !selection.hasAttribute('data-field');
		}) && !!template.content.querySelector('[data-row-selected]'), 'separate accessible selection in Slot cell for every row and template');
		removeSelected.click();
		removeSelected.dispatchEvent(new MouseEvent('click', { bubbles: true }));
		api.removeSelectedRows();
		check(JSON.stringify(api.getRows()) === JSON.stringify(rows), 'no selection removal leaves all rows unchanged');
		selectSlot(2);
		check(!removeSelected.disabled, 'selecting a row enables Remove');
		check(JSON.stringify(api.getRows()) === JSON.stringify(rows), 'selection does not change scheduler JSON or Active');
		selectSlot(2, false);
		check(removeSelected.disabled, 'deselecting last selected row disables Remove');
		selectSlot(2);
		api.setRows(rows);
		check(allUnselected() && removeSelected.disabled, 'setRows clears selection even for reused rows');
		const first = root.querySelector('tr[data-slot="0"]');
		check(api.getRow(first).active === true, 'checkbox getter');
		check(first.querySelector('[data-field="time"]').value === '23:59', 'time setter formats HH:MM');
		api.setRow(first, { ...rows[0], on: false });
		check(api.getRow(first).on === false, 'single-row setter');
		api.setRows(rows);
		rejects(() => api.setRows(rows.map(row => ({ ...row, hour: 24 }))), 'reject invalid hour');
		rejects(() => api.setRows(rows.map(row => ({ ...row, active: 1 }))), 'reject nonboolean');
		rejects(() => api.setRows(rows.map(row => ({ ...row, slot: 0 }))), 'reject duplicate slots');
		check(JSON.stringify(api.getRows()) === JSON.stringify(rows), 'invalid setter leaves table unchanged');
		first.querySelector('[data-field="time"]').value = '';
		rejects(() => api.getRows(), 'reject empty time input');
		api.setRows(rows);
		check(api.getRow(first).minute === 59, 'setter repairs invalid current values');
		check(api.getRows()[1].hour === 0 && api.getRows()[1].minute === 0, 'midnight round-trip');
		first.querySelector('[data-field="time"]').value = '12:34:56';
		rejects(() => api.getRows(), 'reject seconds in minute-resolution schedule');
		api.setRows(rows);
		for (const [patch, name] of [
			[{ color: '#123' }, 'reject short color'], [{ color: '#GG1234' }, 'reject nonhex color'],
			[{ message: 'ä'.repeat(33) }, 'reject UTF-8 byte overflow'],
			[{ message: 'bad\nmessage' }, 'reject C0 control'], [{ message: 'bad\u0085' }, 'reject C1 control'],
			[{ message: '\uD800' }, 'reject unpaired surrogate'], [{ range: 2 }, 'reject unknown preset'],
			[{ range: 1, value: 19 }, 'reject value below preset'], [{ range: 1, value: 51 }, 'reject value above preset'],
			[{ value: 1.5 }, 'reject fractional value']
		]) rejects(() => api.setRow(first, { ...rows[0], ...patch }), name);
		api.setRow(first, { ...rows[0], message: '🌈'.repeat(16) });
		check(api.getRow(first).message === '🌈'.repeat(16), 'accept exactly 64 UTF-8 bytes');
		api.setRows(rows);
		check(first.querySelector('[data-field="message"]').value === rows[0].message && !first.querySelector('b'), 'message stays literal text, not markup');
		const range = first.querySelector('[data-field="range"]');
		const slider = first.querySelector('[data-field="value"]');
		range.value = '1';
		range.dispatchEvent(new Event('change', { bubbles: true }));
		check(slider.min === '20' && slider.max === '50' && slider.value === '50', 'range change clamps upper bound');
		api.setRow(first, { ...rows[0], value: 0 });
		range.value = '1';
		range.dispatchEvent(new Event('change', { bubbles: true }));
		check(slider.value === '20', 'range change clamps lower bound');
		slider.value = '42';
		slider.dispatchEvent(new Event('input', { bubbles: true }));
		check(first.querySelector('[data-value-output]').textContent === '42', 'slider output updates live');
		range.value = '';
		slider.min = '90'; slider.max = '95';
		first.querySelector('[data-field="message"]').value = 'ä'.repeat(33);
		api.setRows(rows);
		check(JSON.stringify(api.getRows()) === JSON.stringify(rows), 'setter repairs invalid range, bounds and message');
		await settle();
		check(window.Pickr && actualPickers.length === 8, 'actual bundled Pickr initializes eight anchors');
		await Promise.all(pickerReady);
		check(storageHiddenUntilInit, 'text storage stays hidden and anchor disabled until real Pickr init');
		const nativeInput = first.querySelector('[data-field="color"]');
		const colorAnchor = first.querySelector('[data-color-anchor]');
		check(getComputedStyle(nativeInput).display === 'none', 'ESPUI CSS cannot expose initialized native color input');
		check(nativeInput.type === 'text' && nativeInput.getClientRects().length === 0 && !root.querySelector('input[type="color"]'), 'no native color input or native popup click target exists');
		check(getComputedStyle(colorAnchor).display !== 'none' && colorAnchor.getBoundingClientRect().width > 0, 'scheduler Pickr anchor is visible under ESPUI CSS');
		check(colorAnchor.tagName === 'INPUT' && colorAnchor.type === 'text' && colorAnchor.readOnly &&
			colorAnchor.getAttribute('aria-label') === 'Choose color' && colorAnchor.getAttribute('role') === 'button',
			'color anchor is an accessible readonly text field, independent of schema storage');
		check(colorAnchor.value === '0x12ABEF' && nativeInput.value === '#12ABEF', 'display is uppercase 0xRRGGBB while schema remains #RRGGBB');
		checkLayout(root, 'initial table with trailing template');
		const picker = actualPickers[0];
		const color = () => picker.getColor().toHEXA().toString().slice(0, 7).toUpperCase();
		const draft = value => {
			// setColor() is a committing Pickr API; exercise the real draft text input instead.
			const input = picker.getRoot().app.querySelector('.pcr-result');
			input.value = value;
			input.dispatchEvent(new Event('input', { bubbles: true }));
		};
		check(color() === rows[0].color, 'Pickr initial color matches setter');
		check(picker.getRoot().app.querySelectorAll('.pcr-swatches button').length === 12, 'Pickr has twelve common swatches');
		check(picker.getRoot().app.dataset.theme === 'monolith', 'Pickr theme matches native ESPUI and bundled stylesheet');
		check(Array.from(picker.getRoot().app.querySelectorAll('.pcr-type')).every(input =>
			input.hidden && getComputedStyle(input).display === 'none'), 'all format toggles including HEX are absent from layout under ESPUI CSS');
		check(picker.getRoot().app.querySelector('.pcr-result').type === 'text' &&
			!picker.getRoot().app.querySelector('.pcr-result').hidden &&
			!picker.getRoot().app.querySelector('.pcr-save').hidden && !picker.getRoot().app.querySelector('.pcr-cancel').hidden,
			'hex text entry and Save/Cancel remain enabled');
		check(!first.querySelector('[data-color-status]').textContent, 'ready picker clears loading feedback');
		for (const [hex, rgb, foreground] of [
			['#000000', 'rgb(0, 0, 0)', 'rgb(255, 255, 255)'],
			['#FFFFFF', 'rgb(255, 255, 255)', 'rgb(0, 0, 0)'],
			['#0000FF', 'rgb(0, 0, 255)', 'rgb(255, 255, 255)'],
			['#00FF00', 'rgb(0, 255, 0)', 'rgb(0, 0, 0)']
		]) {
			api.setRow(first, { ...rows[0], color: hex });
			check(colorAnchor.value === '0x' + hex.slice(1) && getComputedStyle(colorAnchor).backgroundColor === rgb &&
				getComputedStyle(colorAnchor).color === foreground && api.getRow(first).color === hex,
				'actual background and luminance-based text contrast for ' + hex);
		}
		api.setRow(first, { ...rows[0], color: '#AABBCC' });
		check(color() === '#AABBCC', 'setter synchronizes actual Pickr');
		colorAnchor.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
		check(picker.isOpen(), 'Enter opens the readonly anchor picker');
		picker.hide();
		colorAnchor.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true }));
		check(picker.isOpen(), 'Space opens the readonly anchor picker');
		picker.hide();
		colorAnchor.click();
		check(picker.isOpen() && picker.getRoot().app.classList.contains('visible'), 'scheduler anchor opens actual monolith Pickr popup');
		check(Array.from(picker.getRoot().app.querySelectorAll('.pcr-type')).every(input => input.getClientRects().length === 0) &&
			['.pcr-result', '.pcr-save', '.pcr-cancel'].every(selector => picker.getRoot().app.querySelector(selector).getBoundingClientRect().width > 0),
			'open dialog shows hex entry/Save/Cancel but no HEX representation button');
		draft('#FF0000');
		check(api.getRow(first).color === '#AABBCC', 'draft color does not commit');
		picker.getRoot().app.querySelector('.pcr-save').click();
		check(api.getRow(first).color === '#FF0000', 'Pickr Save commits selected color');
		check(colorAnchor.value === '0xFF0000', 'Pickr Save updates displayed 0x value');
		picker.show(); draft('#00FF00');
		picker.getRoot().app.querySelector('.pcr-cancel').click();
		check(api.getRow(first).color === '#FF0000' && color() === '#FF0000', 'Pickr Cancel discards draft');
		check(colorAnchor.value === '0xFF0000', 'Pickr Cancel preserves committed anchor label');
		picker.show(); draft('#0000FF'); picker.hide();
		check(api.getRow(first).color === '#FF0000' && color() === '#FF0000', 'Pickr hide discards draft');
		api.setRows(rows);
		// Structural notifications must not recreate instances or continually mutate the DOM.
		let mutations = 0;
		const monitor = new MutationObserver(records => { mutations += records.length; });
		monitor.observe(document.documentElement, { childList: true, subtree: true });
		const marker = document.createElement('span'); root.append(marker);
		await settle();
		const settledMutations = mutations;
		await settle(); monitor.disconnect(); marker.remove();
		check(actualPickers.length === 8, 'observer initializes each anchor only once');
		check(mutations === settledMutations, 'observer settles without mutation loop');
		let submitted;
		window.fetch = async (url, options) => {
			submitted = { url, options };
			return { ok: true, text: async () => 'Queued for logging; not persisted.' };
		};
		await api.save();
		check(submitted.url === '/scheduler/save' && submitted.options.method === 'POST', 'POST endpoint');
		check(JSON.stringify(JSON.parse(submitted.options.body).rows) === JSON.stringify(rows), 'submission includes inactive slots');
		check(!root.querySelector('[data-action="save-scheduler"]').disabled, 'button restored after submission');
		window.fetch = async () => ({ ok: false, text: async () => 'Queue unavailable.' });
		await api.save();
		check(root.querySelector('[data-scheduler-status]').textContent === 'Queue unavailable.', 'server error feedback');
		check(removeSelected.disabled, 'failed Save keeps Remove disabled without selection');
		selectSlot(1);
		window.fetch = async (url, options) => {
			submitted = { url, options };
			return { ok: true, text: async () => 'Queued for logging; not persisted.' };
		};
		await api.save();
		check(JSON.stringify(JSON.parse(submitted.options.body)) === JSON.stringify({ rows }) &&
			root.querySelector('tr[data-slot="1"] [data-row-selected]').checked && !removeSelected.disabled,
			'Save with selected row sends only scheduler schema and retains browser selection');
		let finishSave;
		window.fetch = () => new Promise(resolve => { finishSave = resolve; });
		const pendingSave = api.save();
		check(Array.from(root.querySelectorAll('[data-action]')).every(button => button.disabled), 'all scheduler actions disabled while Save is busy');
		selectSlot(1, false);
		check(removeSelected.disabled, 'deselection during Save keeps Remove disabled');
		selectSlot(2);
		check(removeSelected.disabled, 'selection during Save cannot enable Remove');
		removeSelected.dispatchEvent(new MouseEvent('click', { bubbles: true }));
		api.removeSelectedRows();
		check(JSON.stringify(api.getRows()) === JSON.stringify(rows), 'delegated Remove ignored while busy');
		finishSave({ ok: true, text: async () => 'Queued for logging; not persisted.' });
		await pendingSave;
		check(!removeSelected.disabled && root.querySelector('[data-action="add-scheduler-row"]').disabled && !root.querySelector('[data-action="reload-scheduler"]').disabled, 'Save completion restores selected Remove and structural action limits');
		check(JSON.stringify(JSON.parse(submitted.options.body).rows) === JSON.stringify(rows), 'selected checkboxes never enter Save JSON');
		window.fetch = async () => ({ ok: false, text: async () => 'Queue unavailable.' });
		root.querySelector('[data-action="save-scheduler"]').click();
		await new Promise(resolve => setTimeout(resolve, 0));
		check(!root.querySelector('[data-action="save-scheduler"]').disabled, 'delegated Save click completes');
		// Removal compacts displayed indices without rebuilding surviving controls.
		window.fetch = async (url, options) => {
			submitted = { url, options };
			return { ok: true, text: async () => 'Queued for logging; not persisted.' };
		};
		picker.show();
		const removedPopup = picker.getRoot().app;
		api.removeRow(first);
		check(destroyedPickers === 1 && !removedPopup.isConnected, 'Remove destroys open Pickr and removes popup');
		check(JSON.stringify(api.getRows()) === JSON.stringify(rows.slice(1).map((row, slot) => ({ ...row, slot }))), 'public Remove renumbers survivors while preserving values and order');
		checkLayout(root, 'after removal');
		root.querySelector('[data-action="add-scheduler-row"]').click();
		check(api.getRows().map(row => row.slot).join() === '0,1,2,3,4,5,6,7', 'Add appends slot N after renumbering');
		check(JSON.stringify(api.getRows().at(-1)) === JSON.stringify({slot:7,active:false,on:false,from:0,to:0,hour:0,minute:0,color:'#FFFFFF',message:'',range:0,value:0}), 'Add creates default values, not cloned edits');
		check(root.querySelector('[data-action="add-scheduler-row"]').disabled, 'Add disabled at eight rows');
		check(allUnselected() && removeSelected.disabled, 'Add leaves rows unselected');
		const added = root.querySelector('tr[data-slot="7"]');
		check(added.querySelector('[data-row-selected]').getAttribute('aria-label') === 'Select slot 7' && added.querySelector('[data-slot-label]').textContent === '7', 'Add updates template selection label and visible slot');
		await Promise.all(pickerReady); await settle();
		checkLayout(root, 'after addition');
		check(added.querySelector('[data-color-anchor]').value === '0xFFFFFF', 'new row initializes anchor label from default storage');
		selectSlot(7);
		removeSelected.click();
		check(api.getRows().map(row => row.slot).join() === '0,1,2,3,4,5,6' && removeSelected.disabled, 'single selected removal keeps consecutive slots and disables Remove');
		root.querySelector('[data-action="add-scheduler-row"]').click();
		rejects(() => api.addRow(), 'API enforces maximum row count');
		rejects(() => api.setRows([...rows, rows[0]]), 'setter rejects oversized batch');
		await Promise.all(pickerReady); await settle();
		const beforeBatch = destroyedPickers;
		const batchRows = api.getRows();
		selectSlot(2); selectSlot(5); selectSlot(6);
		removeSelected.click();
		check(JSON.stringify(api.getRows()) === JSON.stringify(batchRows.filter(row => ![2,5,6].includes(row.slot)).map((row, slot) => ({ ...row, slot }))), 'batch removes original targets despite index shifts, preserving values and order');
		check(destroyedPickers === beforeBatch + 3 && removeSelected.disabled, 'batch disposes each selected Pickr exactly once and clears Remove availability');
		// Exact requested example: track original rows by reference, not mutable indices.
		const example = rows.map((row, slot) => ({ ...row, active: slot % 2 === 0, on: slot % 3 === 0,
			from: slot % 7, to: (slot + 2) % 7, hour: slot + 8, minute: slot * 7,
			color: '#' + (0x123450 + slot).toString(16).toUpperCase(),
			message: 'Original row ' + slot + ' Grüße 🌈', value: slot % 2 ? 20 + slot : 60 + slot }));
		api.setRows(example);
		await Promise.all(pickerReady); await settle();
		const originalElements = Array.from(root.querySelectorAll('tbody tr[data-slot]'));
		const retainedElements = [1,2,3,6].map(slot => originalElements[slot]);
		const expected = [1,2,3,6].map((original, slot) => ({ ...example[original], slot }));
		const retainedAnchors = retainedElements.map(element => element.querySelector('[data-color-anchor]'));
		const retainedPickers = retainedAnchors.map(anchor => actualPickerByAnchor.get(anchor));
		const retainedPopup = retainedPickers[3].getRoot().app;
		retainedAnchors[3].click();
		const retainedDraft = retainedPopup.querySelector('.pcr-result');
		retainedDraft.value = '#ABCDEF';
		retainedDraft.dispatchEvent(new Event('input', { bubbles: true }));
		const beforeExample = { created: actualPickers.length, destroyed: destroyedPickers };
		[0,4,5,7].forEach(slot => selectSlot(slot));
		removeSelected.click();
		await settle();
		check(JSON.stringify(api.getRows()) === JSON.stringify(expected), 'remove original 0,4,5,7 retains original 1,2,3,6 values/order with slots 0,1,2,3');
		check(Array.from(root.querySelectorAll('tbody tr[data-slot]')).every((element, slot) =>
			element === retainedElements[slot] && element.dataset.slot === String(slot) &&
			element.querySelector('[data-slot-label]').textContent === String(slot) &&
			element.querySelector('[data-row-selected]').getAttribute('aria-label') === 'Select slot ' + slot),
			'exact example keeps original nodes and synchronizes dataset, visible and accessible slot labels');
		check(actualPickers.length === beforeExample.created && destroyedPickers === beforeExample.destroyed + 4 &&
			retainedAnchors.every((anchor, slot) => actualPickerByAnchor.get(anchor) === retainedPickers[slot] && anchor.isConnected),
			'exact example destroys only removed Pickrs and never recreates surviving instances');
		check(retainedPickers[3].isOpen() && retainedPopup.isConnected && retainedDraft.value.toUpperCase() === '#ABCDEF',
			'renumbering preserves surviving open popup and uncommitted color draft');
		await api.save();
		check(JSON.stringify(JSON.parse(submitted.options.body)) === JSON.stringify({ rows: expected }),
			'exact example serializes retained values in order with indices 0,1,2,3 and no selection fields');
		retainedPopup.querySelector('.pcr-save').click();
		check(api.getRow(retainedElements[3]).slot === 3 && api.getRow(retainedElements[3]).color === '#ABCDEF' &&
			retainedAnchors[3].value === '0xABCDEF', 'surviving Pickr Save callback commits to original row 6 now at slot 3');
		retainedAnchors[3].click();
		retainedDraft.value = '#000000';
		retainedDraft.dispatchEvent(new Event('input', { bubbles: true }));
		retainedPopup.querySelector('.pcr-cancel').click();
		check(api.getRow(retainedElements[3]).color === '#ABCDEF', 'surviving Pickr Cancel still discards drafts after renumbering');
		checkLayout(root, 'exact example after compaction');
		api.addRow();
		check(api.getRows().at(-1).slot === 4 && api.getRows().length === 5, 'exact example next Add receives N = 4');
		// Public removal must also preserve invalid, unsaved edits rather than validating/resetting them.
		retainedElements[1].querySelector('[data-field="time"]').value = '';
		retainedElements[1].querySelector('[data-field="message"]').value = 'ä'.repeat(33);
		selectSlot(3);
		api.removeRow(retainedElements[0]);
		check(retainedElements[1].dataset.slot === '0' && retainedElements[1].querySelector('[data-field="time"]').value === '' &&
			retainedElements[1].querySelector('[data-field="message"]').value === 'ä'.repeat(33), 'public removal preserves incomplete and invalid browser edits while renumbering');
		check(retainedElements[3].dataset.slot === '2' && retainedElements[3].querySelector('[data-row-selected]').checked &&
			retainedElements[3].querySelector('[data-row-selected]').getAttribute('aria-label') === 'Select slot 2' && !removeSelected.disabled,
			'public removal preserves surviving selection with updated accessibility and action state');
		api.reload();
		check(JSON.stringify(api.getRows()) === JSON.stringify(initial) &&
			Array.from(root.querySelectorAll('tbody tr[data-slot]')).every((element, slot) => element.dataset.slot === String(slot) &&
				element.querySelector('[data-slot-label]').textContent === String(slot) &&
				element.querySelector('[data-row-selected]').getAttribute('aria-label') === 'Select slot ' + slot),
			'exact example Reload restores untouched original initial snapshot and labels 0..7');
		const sparse = [rows[7], rows[2]];
		api.setRows(sparse);
		check(JSON.stringify(api.getRows()) === JSON.stringify(sparse), 'sparse setter/getter preserves IDs, order and extended fields');
		await Promise.all(pickerReady); await settle();
		checkLayout(root, 'sparse reordered rows');
		const beforeInvalid = JSON.stringify(api.getRows());
		rejects(() => api.setRows([rows[1], {...rows[6], message:'ä'.repeat(33)}]), 'invalid final row rejected before structural changes');
		check(JSON.stringify(api.getRows()) === beforeInvalid, 'invalid batch leaves row count, values and identities unchanged');
		await api.save();
		check(JSON.stringify(JSON.parse(submitted.options.body).rows) === JSON.stringify(sparse), 'Save sends only sparse displayed slots');
		api.setRows([]);
		check(api.getRows().length === 0 && !root.querySelector('[data-action="add-scheduler-row"]').disabled, 'setter supports zero rows and enables Add');
		checkLayout(root, 'empty table');
		await api.save();
		check(JSON.parse(submitted.options.body).rows.length === 0, 'empty Save submits explicit empty batch');
		check(removeSelected.disabled, 'global Remove disabled when table is empty, including after Save');
		removeSelected.click();
		removeSelected.dispatchEvent(new MouseEvent('click', { bubbles: true }));
		check(api.getRows().length === 0, 'disabled global Remove leaves empty table unchanged');
		root.querySelector('[data-action="add-scheduler-row"]').click();
		check(api.getRows().length === 1 && api.getRows()[0].slot === 0, 'Add works from template after removing all rows');
		await Promise.all(pickerReady); await settle();
		checkLayout(root, 'single row without separator');
		check(removeSelected.disabled && allUnselected(), 'Add from empty leaves selection clear and Remove disabled');
		selectSlot(0);
		removeSelected.click();
		check(api.getRows().length === 0, 'Remove supports final row');
		check(removeSelected.disabled, 'removing final row disables global Remove');
		api.setRows(rows);
		await Promise.all(pickerReady); await settle();
		const beforeAll = destroyedPickers;
		root.querySelector('tr[data-slot="0"] [data-color-anchor]').click();
		const allPopup = actualPickers.at(-8).getRoot().app;
		rows.forEach(row => selectSlot(row.slot));
		removeSelected.click();
		check(api.getRows().length === 0 && destroyedPickers === beforeAll + 8 && !allPopup.isConnected, 'select-all removal misses no adjacent rows and disposes all Pickrs including open popup');
		check(removeSelected.disabled && !root.querySelector('[data-action="add-scheduler-row"]').disabled, 'all-row removal disables Remove and enables Add');
		root.querySelector('[data-action="add-scheduler-row"]').click();
		check(api.getRows()[0].slot === 0 && allUnselected(), 'Add after select-all removal restores unselected slot zero');
		selectSlot(0);
		const submittedBeforeReload = submitted;
		root.querySelector('[data-action="reload-scheduler"]').click();
		check(JSON.stringify(api.getRows()) === JSON.stringify(initial), 'Reload restores full initial firmware snapshot including removed rows and early-edited values');
		check(allUnselected() && removeSelected.disabled, 'Reload clears selection and disables Remove');
		check(submitted === submittedBeforeReload, 'Reload does not submit or save');
		await Promise.all(pickerReady); await settle();
		const activePicker = actualPickers.at(-8);
		checkLayout(root, 'reloaded table');
		check(root.querySelector('[data-color-anchor]').value === '0x2244FF', 'Reload restores firmware color display');
		activePicker.show();
		const reloadedPopup = activePicker.getRoot().app;
		const destroyedBeforeReload = destroyedPickers;
		api.reload();
		check(destroyedPickers === destroyedBeforeReload + 8 && !reloadedPopup.isConnected, 'Reload destroys all current Pickrs including open popup');
		check(JSON.stringify(api.getRows()) === JSON.stringify(initial), 'repeated Reload does not replace baseline with Save or setter values');
		await Promise.all(pickerReady); await settle();
		api.setRows([]);
		const bundledPickr = window.Pickr;
		window.Pickr = {}; // Loader placeholder is not a usable API.
		api.addRow();
		const fallback = root.querySelector('tr[data-slot]');
		check(fallback.querySelector('[data-color-anchor]').disabled && getComputedStyle(fallback.querySelector('[data-field="color"]')).display === 'none', 'missing library disables anchor without native fallback');
		check(fallback.querySelector('[data-color-status]').textContent.includes('unavailable'), 'missing library has clear feedback');
		api.setRow(fallback, { ...rows[0], color: '#334455' });
		check(fallback.querySelector('[data-color-anchor]').value === '0x334455', 'anchor display synchronizes even before Pickr is available');
		check(typeof pickerRetryTask === 'function', 'unavailable library schedules bounded-work retry');
		window.Pickr = bundledPickr;
		clearTimeout(pickerRetryId); pickerRetryTask();
		await Promise.all(pickerReady); await settle();
		check(!fallback.querySelector('[data-color-anchor]').disabled && fallback.querySelector('[data-color-status]').textContent === '', 'late library enables Pickr and clears unavailable feedback');
		check(actualPickers.at(-1).getColor().toHEXA().toString().slice(0, 7).toUpperCase() === '#334455', 'setter before deferred init is preserved');
		const beforeReplacement = destroyedPickers;
		const replacement = fallback.cloneNode(true);
		fallback.replaceWith(replacement); await settle();
		await Promise.all(pickerReady); await settle();
		check(destroyedPickers === beforeReplacement + 1 && !replacement.querySelector('[data-color-anchor]').disabled, 'ESPUI row replacement disposes old picker and initializes new one');
		api.reload();
		check(JSON.stringify(api.getRows()) === JSON.stringify(initial), 'DOM replacement does not redefine initial snapshot');
		check(JSON.stringify(api.getRows()[0]) === JSON.stringify({slot:0,active:true,on:true,from:3,to:5,hour:19,minute:42,color:'#2244FF',message:'Initial & firmware',range:1,value:35}), 'Reload restores nondefault firmware values for every field');
		check(storageHiddenUntilInit, 'late and replacement pickers never expose color storage');
		check(root.querySelectorAll('[data-action="save-scheduler"]').length === 1, 'one scheduler Save button');
		selectSlot(3);
		const replacementRoot = root.cloneNode(true);
		replacementRoot.querySelector('[data-field="message"]').setAttribute('value', 'Later firmware update');
		const beforeRootReplacement = destroyedPickers;
		root.replaceWith(replacementRoot);
		await settle(); await Promise.all(pickerReady); await settle();
		check(destroyedPickers === beforeRootReplacement + 8, 'whole ESPUI label replacement disposes old pickers');
		check(!replacementRoot.querySelector('[data-row-selected]:checked') &&
			replacementRoot.querySelector('[data-action="remove-selected-scheduler-rows"]').disabled,
			'new ESPUI root starts unselected even when cloned from selected controls');
		api.reload(replacementRoot);
		check(JSON.stringify(api.getRows(replacementRoot)) === JSON.stringify(initial), 'whole-label updates cannot overwrite original Reload baseline');
		await Promise.all(pickerReady); await settle();
		checkLayout(replacementRoot, 'whole-label replacement and Reload');
		const otherAnchor = document.createElement('button');
		document.body.append(otherAnchor);
		const otherPicker = window.Pickr.create({ el: otherAnchor, useAsButton: true, theme: 'monolith', default: '#FFFFFF',
			components: { interaction: { hex: true, input: true, save: true, cancel: true } } });
		await new Promise(resolve => otherPicker.on('init', resolve));
		otherPicker.show();
		check(otherPicker.getRoot().app.querySelector('.pcr-type[data-type="HEXA"]').getBoundingClientRect().width > 0,
			'non-scheduler Pickr retains its HEX toggle');
		otherPicker.destroyAndRemove(); otherAnchor.remove();
		output.textContent += '\n' + passed + ' tests passed.';
		const summary = document.createElement('p');
		summary.textContent = passed + ' tests passed.';
		output.after(summary);
		document.querySelector('h1').textContent = 'Scheduler table tests: ' + passed + ' passed';
		document.title = document.querySelector('h1').textContent;
		document.body.dataset.testResult = 'passed';
	} catch (error) {
		output.textContent += '\nFAIL: ' + error.message;
		document.querySelector('h1').textContent = 'Scheduler table tests: FAIL after ' + passed + ' checks: ' + error.message;
		document.title = document.querySelector('h1').textContent;
		document.body.dataset.testResult = 'failed';
	}
})();
</script>
</body>
</html>
